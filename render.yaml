# Render blueprint for the FastAPI service (src/vitals_api.py).
#
# NOT part of deploying the dashboard. web/ bakes the whole cohort analysis into
# static JSON and serves it from Vercel with no backend at all — see
# docs/deploy.md §5 for why the two were split apart. Nothing in web/ reads this
# service any more; the EWS_API_ORIGIN proxy it used to sit behind is gone.
#
# Kept because the API is still a working entry point if you want one live (for
# a different client, or to poke at /api/patients). It loads
# models/dashboard_challenge2019.pkl and serves it — it never reads the raw
# Challenge-2019 files, which are not in the repo and would take ~5 minutes and
# 4 GB to process. Build the artifact locally first (docs/deploy.md §1) and
# commit it, or the service starts with the synthetic cohort.
#
# Memory: steady state is ~461 MB, and both the free and Starter plans cap at
# 512 MB. It runs, but concurrent requests can OOM it.

services:
  - type: web
    name: ews-api
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements-api.txt
    startCommand: uvicorn vitals_api:app --app-dir src --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: EWS_ARTIFACT
        value: models/dashboard_challenge2019.pkl
      # Browser requests are proxied by Next server-side, so no browser origin
      # reaches this service. Set explicitly only if you bypass that proxy.
      - key: EWS_CORS_ORIGINS
        value: ""
      # Set in the Render dashboard, never in this file. Without it the
      # natural-language button is disabled and everything else still works.
      - key: GROQ_API_KEY
        sync: false
