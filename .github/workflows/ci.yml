name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint imports & run tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify all modules import
        # torch-dependent modules (utils, dataset, model, train_dl) are excluded:
        # torch lives in requirements-torch.txt and is not installed in CI.
        run: |
          python -c "import sys; sys.path.insert(0, 'src'); import vitals_data, vitals_train, vitals_explain, vitals_report, vitals_phenotype, omop_explore, mimic_explore, sepsis_explore; print('src modules import OK')"
          python -c "import sys; sys.path.insert(0, 'legacy'); import data_loader, train, explainability, main; print('legacy modules import OK')"

      - name: Run tests
        # Data-dependent tests skip automatically when the git-ignored
        # datasets are absent; data-independent tests always run.
        run: pytest -q
